<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo web · ERP Genia Creativa</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { --rosa: #de569a; --baya: #b8327a; --amarillo: #fdc408; --tinta: #2b1a2b; --gris: #6b5f6b; --linea: #eadfe7; --fondo: #faf6f9; --verde: #15803d; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--tinta); background: var(--fondo); }
  header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--linea); padding: 14px 16px; }
  .fila { max-width: 1100px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; flex: 1 1 auto; }
  h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--gris); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  button, .btn { font: inherit; border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; text-decoration: none; display: inline-block; }
  .principal { background: var(--baya); color: #fff; font-weight: 600; }
  .principal:disabled { opacity: .55; cursor: wait; }
  .secundario { background: #fff; color: var(--baya); border: 1.5px solid var(--baya); }
  .barra { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  input[type=search], select { font: inherit; padding: 8px 12px; border: 1px solid var(--linea); border-radius: 10px; background: #fff; min-width: 0; }
  input[type=search] { flex: 1 1 220px; }
  .aviso { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; display: none; }
  .aviso.ok { display: block; background: #e8f6ec; color: var(--verde); }
  .aviso.error { display: block; background: #fdecec; color: #b42318; }
  .aviso.info { display: block; background: #fff8e1; color: #7a5b00; }
  .lista { display: grid; gap: 8px; }
  .item { display: grid; grid-template-columns: auto 56px 1fr; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 10px 12px; }
  .item.inactivo { opacity: .55; }
  .item img, .item .sinfoto { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: #fdf0f6; }
  .nombre { font-weight: 600; }
  .meta { color: var(--gris); font-size: 13px; }
  .desc { width: 100%; margin-top: 6px; font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--linea); border-radius: 8px; }
  .desc:disabled { background: #f6f2f5; }
  .interruptor { position: relative; width: 46px; height: 26px; }
  .interruptor input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
  .interruptor span { position: absolute; inset: 0; border-radius: 99px; background: #d8ccd5; transition: .15s; }
  .interruptor span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .15s; }
  .interruptor input:checked + span { background: var(--rosa); }
  .interruptor input:checked + span::after { left: 23px; }
  .interruptor input:focus-visible + span { outline: 3px solid var(--amarillo); }
  .contador { font-weight: 600; color: var(--baya); }
  .vacio { text-align: center; color: var(--gris); padding: 40px 0; }
</style>
</head>
<body>
<header>
  <div class="fila">
    <h1>Catálogo de la web<small>Elige qué productos se muestran en gcreativa.com y publícalos.</small></h1>
    <a class="btn secundario" href="/">Volver al ERP</a>
    <button class="principal" id="publicar" type="button">Publicar catálogo</button>
  </div>
</header>
<main>
  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
  <div class="barra">
    <input type="search" id="buscar" placeholder="Buscar por nombre o código…" aria-label="Buscar producto">
    <select id="filtro" aria-label="Filtro">
      <option value="todos">Todos</option>
      <option value="web">Solo en la web</option>
      <option value="noweb">No están en la web</option>
    </select>
    <span><span class="contador" id="contador">0</span> en la web</span>
  </div>
  <div class="lista" id="lista"><p class="vacio">Cargando…</p></div>
</main>
<script>
  const TOKEN = (() => { try { return localStorage.getItem('token_tienda_regalos'); } catch (e) { return null; } })();
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  let productos = [];

  function aviso(tipo, texto) { const a = $('aviso'); a.className = 'aviso ' + tipo; a.textContent = texto; }

  async function api(ruta, opciones = {}) {
    const r = await fetch('/api' + ruta, { ...opciones, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN } });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 || r.status === 403 && /Token/.test(j.message || '')) { location.href = '/'; throw new Error('Sesión vencida'); }
    if (!r.ok || j.success === false) throw new Error(j.message || 'Error ' + r.status);
    return j;
  }

  function pintar() {
    const q = $('buscar').value.trim().toLowerCase();
    const f = $('filtro').value;
    const lista = productos.filter((p) =>
      (!q || (p.nombre + ' ' + (p.codigo || '')).toLowerCase().includes(q)) &&
      (f === 'todos' || (f === 'web') === !!Number(p.web_visible)));
    $('contador').textContent = productos.filter((p) => Number(p.web_visible) && Number(p.activo)).length;
    $('lista').innerHTML = lista.length ? lista.map((p) => `
      <div class="item ${Number(p.activo) ? '' : 'inactivo'}">
        <label class="interruptor" title="Mostrar en la web">
          <input type="checkbox" data-id="${p.id}" ${Number(p.web_visible) ? 'checked' : ''} aria-label="Mostrar ${esc(p.nombre)} en la web">
          <span></span>
        </label>
        ${p.imagen_url ? `<img src="${esc(p.imagen_url)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sinfoto'}))">` : '<div class="sinfoto"></div>'}
        <div>
          <div class="nombre">${esc(p.nombre)}</div>
          <div class="meta">${esc(p.codigo || '')} · S/ ${Number(p.precio_venta).toFixed(2)}${p.categoria ? ' · ' + esc(p.categoria) : ''}${p.ocasion ? ' · ' + esc(p.ocasion) : ''}${Number(p.destacado) ? ' · ★ destacado' : ''}${Number(p.activo) ? '' : ' · deshabilitado (no se publica)'}</div>
          <input class="desc" data-desc="${p.id}" maxlength="300" value="${esc(p.web_descripcion || '')}" placeholder="Descripción para clientes (opcional, máx. 300)" ${Number(p.web_visible) ? '' : 'disabled'}>
        </div>
      </div>`).join('') : '<p class="vacio">No hay productos con ese filtro.</p>';
  }

  async function cargar() {
    if (!TOKEN) { aviso('error', 'Primero inicia sesión en el ERP.'); $('lista').innerHTML = '<p class="vacio"><a href="/">Ir a iniciar sesión</a></p>'; return; }
    try {
      const j = await api('/web-catalog/productos');
      productos = j.productos;
      if (!j.destino) aviso('info', 'Falta configurar CATALOGO_WEB_PATH en el .env del ERP: puedes marcar productos, pero aún no se podrá publicar.');
      pintar();
    } catch (e) { aviso('error', e.message); }
  }

  $('lista').addEventListener('change', async (ev) => {
    const t = ev.target;
    if (t.dataset.id) {
      const p = productos.find((x) => x.id == t.dataset.id);
      try {
        await api('/web-catalog/productos/' + p.id, { method: 'PUT', body: JSON.stringify({ web_visible: t.checked }) });
        p.web_visible = t.checked ? 1 : 0;
        aviso('info', 'Cambios guardados. Pulsa «Publicar catálogo» para que se vean en la web.');
        pintar();
      } catch (e) { t.checked = !t.checked; aviso('error', e.message); }
    } else if (t.dataset.desc) {
      const p = productos.find((x) => x.id == t.dataset.desc);
      try {
        await api('/web-catalog/productos/' + p.id, { method: 'PUT', body: JSON.stringify({ web_descripcion: t.value }) });
        p.web_descripcion = t.value.trim();
        aviso('info', 'Descripción guardada. Pulsa «Publicar catálogo» para que se vea en la web.');
      } catch (e) { aviso('error', e.message); }
    }
  });
  $('buscar').addEventListener('input', pintar);
  $('filtro').addEventListener('change', pintar);
  $('publicar').addEventListener('click', async () => {
    const b = $('publicar'); b.disabled = true; b.textContent = 'Publicando…';
    try { const j = await api('/web-catalog/publicar', { method: 'POST', body: '{}' }); aviso('ok', j.message); }
    catch (e) { aviso('error', e.message); }
    finally { b.disabled = false; b.textContent = 'Publicar catálogo'; }
  });
  cargar();
</script>
</body>
</html>
